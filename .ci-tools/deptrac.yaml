parameters:
  paths:
    - './../src'
  layers:
    - name: 'Library'
      collectors:
        - type: bool
          must:
            - { type: classLike, value: '^AccessControl\\' }
          must_not:
            - { type: classLike, value: '^AccessControl\\Bundle\\' }
    - name: 'Bundle'
      collectors:
        - { type: classLike, value: '^AccessControl\\Bundle\\' }
    - name: 'Security'
      collectors:
        - { type: classLike, value: '^Symfony\\Component\\Security\\' }
        - { type: classLike, value: '^Symfony\\Bundle\\SecurityBundle\\' }
    # Reached by the Test/ namespaces alone, which are shipped so an application can assert on
    # access decisions. Anything else depending on PHPUnit would be a test helper that escaped.
    - name: 'PHPUnit'
      collectors:
        - { type: classLike, value: '^PHPUnit\\' }
    - name: 'Vendors'
      collectors:
        - { type: classLike, value: '^Symfony\\' }
        - { type: classLike, value: '^Psr\\' }
        - { type: classLike, value: '^Twig\\' }
        - { type: classLike, value: '^Composer\\' }
  ruleset:
    Library:
      - 'Vendors'
      - 'Security'
      - 'PHPUnit'
    Bundle:
      - 'Library'
      - 'Vendors'
      - 'Security'
      - 'PHPUnit'
    Security: ~
    Vendors: ~
    PHPUnit: ~
